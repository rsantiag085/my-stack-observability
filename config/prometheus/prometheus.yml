global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: lab

rule_files:
  - /etc/prometheus/rules/recording.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']

  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']

  # ---------------------------------------------------------------------------
  # kube-state-metrics — estado dos objetos Kubernetes no Minikube
  # VM docker: 192.168.10.112 — NodePort 32080 → Minikube 192.168.49.2:32080
  # ---------------------------------------------------------------------------
  - job_name: kube-state-metrics
    static_configs:
      - targets: ['192.168.10.112:32080']

  # ---------------------------------------------------------------------------
  # Zabbix — métricas via zabbix_exporter (a configurar)
  # Ref: https://github.com/zabbix/zabbix-docker
  # ---------------------------------------------------------------------------
  # - job_name: zabbix
  #   static_configs:
  #     - targets: ['<IP_ZABBIX>:9224']
