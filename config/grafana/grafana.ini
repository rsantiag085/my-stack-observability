[server]
domain = 192.168.10.104
root_url = http://192.168.10.104:3000/
enable_gzip = true

[security]
disable_gravatar = true
cookie_secure = false
; admin_user e admin_password definidos via GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD
; secret_key definida via GF_SECURITY_SECRET_KEY

[plugins]
allow_loading_unsigned_plugins = jdbranham-diagram-panel

[analytics]
reporting_enabled = false
check_for_updates = false

[log]
mode = console
level = info

[dashboards]
default_home_dashboard_path =

[users]
allow_sign_up = false
